<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zven · 三种观看方式</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#ececea;background:#101110;color-scheme:dark;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #d7ec87;outline-offset:5px}.study-bar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px;border-bottom:1px solid #ffffff1e;background:#101110}.identity{display:flex;align-items:baseline;gap:16px}.identity b{font-size:19px;letter-spacing:-1px;font-weight:500}.identity span{font-size:10px;color:#8f948e;letter-spacing:2px}nav{display:flex;align-self:stretch;gap:6px}nav button{border:0;border-bottom:2px solid transparent;background:transparent;display:flex;gap:12px;align-items:center;padding:0 25px;font-size:13px;color:#92978f;transition:color .2s}nav button small{font-size:10px;font-family:monospace}nav button[aria-pressed=true]{color:#e7f6b8;border-bottom-color:#d7ec87}nav button:hover{color:white}.aside{display:flex;align-items:center;gap:22px;font-size:11px}.aside a{color:#81867e;text-decoration:none}.aside button{background:none;border:0;padding:8px 0;color:#b4baaf;font-size:11px}.stage{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:#080a0a}.note{position:fixed;right:24px;top:78px;width:340px;background:#181b18eb;border:1px solid #454b40;padding:25px;z-index:10;backdrop-filter:blur(20px);box-shadow:0 20px 60px #0004}.note[hidden]{display:none}.note-label{font-size:10px;color:#a9b593;letter-spacing:1px}.note h1{font-weight:500;font-size:22px;margin:15px 0}.note p{font-size:13px;line-height:1.95;color:#bbc1b5;margin:0 0 18px}.note .minor{font-size:11px;color:#828b7b;margin:0}.note button{position:absolute;right:14px;top:13px;font-size:20px;color:#8e9785;background:none;border:0}.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#68735e;pointer-events:none;z-index:-1}@media(max-width:700px){.study-bar{height:96px;position:relative;padding:0 18px;align-items:flex-start}.identity{height:42px;align-items:center;gap:10px}.identity b{font-size:16px}.identity span{font-size:9px;letter-spacing:1px}.aside{height:42px;gap:14px}.aside a{display:none}nav{position:absolute;bottom:0;left:0;right:0;justify-content:center;height:48px;gap:0}nav button{justify-content:center;flex:1;font-size:12px;padding:0 10px;gap:9px}.stage{height:calc(100dvh - 96px)}.note{top:110px;right:14px;width:calc(100% - 28px);max-width:340px}}
</style>
</head>
<body>
<header class="study-bar">
<div class="identity"><b>ZVEN</b><span>视觉研究 / 01</span></div>
<nav aria-label="切换视觉方向"><button data-direction="signal" aria-pressed="true"><small>01</small>暗场</button><button data-direction="white" aria-pressed="false"><small>02</small>白场</button><button data-direction="type" aria-pressed="false"><small>03</small>字场</button></nav>
<div class="aside"><a href="http://127.0.0.1:4318/" target="_blank" rel="noopener">上一版</a><button id="explain" aria-expanded="false" aria-controls="note">方向说明 ＋</button></div>
</header>
<main><iframe class="stage" id="stage" title="方向 01：暗场" src="signal.html"></iframe></main>
<aside class="note" id="note" hidden aria-label="当前方向说明"><button id="close-note" aria-label="收起方向说明">×</button><span class="note-label">VISUAL STUDY — NOT A FINAL IDENTITY</span><h1 id="note-title"></h1><p id="note-copy"></p><p class="minor">此处的方向名只用于比较方案。页面为视觉与阅读交互探索，内容为虚构示例。</p></aside>
<script>
const studies={signal:{title:'暗场',number:'01',copy:'把档案压缩成一个被观看的空间。黑色、尺度与光的变化先建立距离，再由六个方向进入记录。偏冷、肃静，有观测装置的感受。'},white:{title:'白场',number:'02',copy:'把记录看作未来留存的一件异物。冷白环境中只保留一个形体与少量文字；选择维度时，阅读从空白中展开。偏陌生、精确，有展览的感受。'},type:{title:'字场',number:'03',copy:'让字体与阅读顺序共同构成画面。用巨幅字形、色面和切片取代栏目；维度切换成为一次翻页。偏强烈、直接，有实验出版物的感受。'}};
const frame=document.querySelector('#stage'),note=document.querySelector('#note'),explain=document.querySelector('#explain');let current='';
function activate(key,writeHash=true){if(!studies[key])key='signal';const s=studies[key];if(current!==key){frame.src=key+'.html';frame.title='方向 '+s.number+'：'+s.title;current=key;}document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===key)));document.querySelector('#note-title').textContent=s.number+' / '+s.title;document.querySelector('#note-copy').textContent=s.copy;document.title='Zven · '+s.title+' / 视觉研究';if(writeHash)history.replaceState(null,'','#'+key);}
function setNote(open){note.hidden=!open;explain.setAttribute('aria-expanded',String(open));explain.textContent=open?'方向说明 −':'方向说明 ＋';}
document.querySelectorAll('[data-direction]').forEach(b=>b.addEventListener('click',()=>{activate(b.dataset.direction);setNote(false);}));explain.addEventListener('click',()=>setNote(note.hidden));document.querySelector('#close-note').addEventListener('click',()=>{setNote(false);explain.focus();});addEventListener('hashchange',()=>activate(location.hash.slice(1),false));addEventListener('keydown',e=>{if(e.key==='Escape')setNote(false);if(['1','2','3'].includes(e.key)&&e.target===document.body)activate(['signal','white','type'][Number(e.key)-1]);});activate(location.hash.slice(1)||'signal',false);
</script>
</body>
</html>
